services:
  - type: web
    name: monieplans-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monieplans-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: monieplans-db
    databaseName: monieplans
    user: monieplans
    region: oregon
    plan: free
